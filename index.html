<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Script Reader</title>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1b1b1a;
    --muted: #6b6a66;
    --border: #dddbd4;
    --accent: #2f6fde;
    --accent-text: #ffffff;
    --current: #fff1b8;
    --live: #d33a2c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212;
      --surface: #1c1c1c;
      --text: #f2f1ec;
      --muted: #9a998f;
      --border: #333230;
      --accent: #5b8ff0;
      --accent-text: #0d0d0d;
      --current: #4a3f12;
      --live: #ff6b5c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212;
    --surface: #1c1c1c;
    --text: #f2f1ec;
    --muted: #9a998f;
    --border: #333230;
    --accent: #5b8ff0;
    --accent-text: #0d0d0d;
    --current: #4a3f12;
    --live: #ff6b5c;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    position: fixed; inset: 0; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  button {
    font: inherit;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    min-height: 44px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.live { background: var(--live); border-color: var(--live); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  header {
    flex-shrink: 0; position: relative; z-index: 2;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 17px; margin: 0 auto 0 0; }
  .hint { color: var(--muted); font-size: 13px; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* Editor */
  #editor { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px; max-width: 900px; width: 100%; margin: 0 auto; }
  #scriptInput {
    flex: 1; min-height: 240px; width: 100%;
    font: 18px/1.5 inherit; font-family: inherit;
    padding: 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    resize: none;
  }

  /* Reader */
  #reader { flex: 1; min-height: 0; display: none; flex-direction: column; }
  #scroller { position: relative; flex: 1; overflow-y: auto; padding: 24px 16px 60vh; scroll-behavior: smooth; }
  #script {
    max-width: 900px; margin: 0 auto;
    font-size: var(--fs, 34px); line-height: 1.5; font-weight: 500;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .w { border-radius: 6px; transition: opacity .35s ease, background-color .2s ease; cursor: pointer; }
  .w.read { opacity: 0; }
  .w.cur { background: var(--current); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  #status { font-size: 13px; color: var(--muted); padding: 0 16px 6px; text-align: center; min-height: 1.2em; }

  /* Stopwatch */
  footer {
    flex-shrink: 0; position: relative; z-index: 2;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  #time { font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; min-width: 6.5ch; text-align: center; }
  #progress { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Script Reader</h1>
  <div class="controls" id="readerControls" style="display:none">
    <button id="micBtn" class="primary">🎤 Start listening</button>
    <button id="undoBtn" title="Bring back the last word (←)">↶ Back</button>
    <button id="restartBtn">Restart</button>
    <label>Size <input id="size" type="range" min="18" max="72" value="34"></label>
    <button id="editBtn">Edit script</button>
  </div>
</header>

<main>
  <section id="editor">
    <textarea id="scriptInput" placeholder="Paste or type your script here…"></textarea>
    <div class="controls">
      <button id="goBtn" class="primary">Start reading →</button>
      <span class="hint">Read out loud and words vanish as you say them. You can also tap a word to jump there, or press Space / → to clear the next word.</span>
    </div>
  </section>

  <section id="reader">
    <div id="scroller"><div id="script"></div></div>
    <div id="status"></div>
  </section>
</main>

<footer>
  <span id="time">00:00.0</span>
  <button id="swBtn" class="primary">Start</button>
  <button id="swReset">Reset</button>
  <span id="progress"></span>
</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  // ---------- Script / reader ----------
  let words = [];      // {el, norm}
  let pos = 0;         // index of next unread word

  // Speech recognition may say "one" where the script says "1" (or the reverse).
  const NUMS = ["zero","one","two","three","four","five","six","seven","eight","nine","ten",
    "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
  const norm = s => {
    const w = s.toLowerCase().replace(/[’']/g, "").replace(/[^\p{L}\p{N}]+/gu, "");
    const n = NUMS.indexOf(w);
    return n >= 0 ? String(n) : w;
  };

  $("scriptInput").value = store.get("script") || "";
  const savedSize = store.get("fontSize");
  if (savedSize) $("size").value = savedSize;
  applySize();

  function build(text) {
    const box = $("script");
    box.textContent = "";
    words = [];
    // Split keeping whitespace so paragraphs/line breaks survive.
    for (const part of text.split(/(\s+)/)) {
      if (!part) continue;
      if (/^\s+$/.test(part)) { box.appendChild(document.createTextNode(part)); continue; }
      const span = document.createElement("span");
      span.className = "w";
      span.textContent = part;
      const i = words.length;
      span.addEventListener("click", () => setPos(i + 1));
      box.appendChild(span);
      words.push({ el: span, norm: norm(part) });
    }
    pos = 0;
    skipEmpty();
    render();
  }

  // Skip tokens that are only punctuation (e.g. "—") so they don't block progress.
  function skipEmpty() { while (pos < words.length && !words[pos].norm) pos++; }

  function setPos(p) {
    pos = Math.max(0, Math.min(words.length, p));
    skipEmpty();
    render();
  }

  function render() {
    words.forEach((w, i) => {
      w.el.classList.toggle("read", i < pos);
      w.el.classList.toggle("cur", i === pos);
    });
    $("progress").textContent = words.length ? `${pos} / ${words.length} words` : "";
    const cur = words[pos];
    if (cur) {
      const sc = $("scroller");
      const target = cur.el.offsetTop - sc.clientHeight * 0.25;
      if (Math.abs(sc.scrollTop - target) > 4) sc.scrollTop = target;
    } else if (words.length) {
      setStatus("🎉 Done! You reached the end of the script.");
    }
  }

  function applySize() {
    document.documentElement.style.setProperty("--fs", $("size").value + "px");
  }
  $("size").addEventListener("input", () => { applySize(); store.set("fontSize", $("size").value); render(); });

  $("goBtn").addEventListener("click", () => {
    const text = $("scriptInput").value.trim();
    if (!text) { $("scriptInput").focus(); return; }
    store.set("script", $("scriptInput").value);
    $("editor").style.display = "none";
    $("reader").style.display = "flex";
    $("readerControls").style.display = "flex";
    build(text);
    setStatus(SR ? "Tap “Start listening”, then read aloud." : "Voice tracking isn’t supported in this browser — tap words or press Space to clear them.");
  });

  $("editBtn").addEventListener("click", () => {
    stopListening();
    $("reader").style.display = "none";
    $("readerControls").style.display = "none";
    $("editor").style.display = "flex";
    $("progress").textContent = "";
  });
  $("restartBtn").addEventListener("click", () => { setPos(0); $("scroller").scrollTop = 0; setStatus(""); });
  $("undoBtn").addEventListener("click", () => back());

  function back() {
    let p = pos - 1;
    while (p > 0 && !words[p].norm) p--;
    setPos(p);
  }

  document.addEventListener("keydown", e => {
    if ($("reader").style.display !== "flex") return;
    if (e.key === " " || e.key === "ArrowRight") { e.preventDefault(); setPos(pos + 1); }
    else if (e.key === "ArrowLeft" || e.key === "Backspace") { e.preventDefault(); back(); }
  });

  function setStatus(t) { $("status").textContent = t; }

  // ---------- Speech tracking ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  let consumed = {}; // result index -> number of spoken words already matched

  if (!SR) { $("micBtn").disabled = true; $("micBtn").textContent = "🎤 Not supported"; }

  const LOOKAHEAD = 8;

  function similar(a, b) {
    if (a === b) return true;
    if (a.length < 4 || b.length < 4) return false;
    // Allow small recognition slips on longer words (e.g. "colour" vs "color").
    if (a.startsWith(b) || b.startsWith(a)) return true;
    return lev(a, b) <= (Math.max(a.length, b.length) > 7 ? 2 : 1);
  }
  function lev(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++)
      for (let j = 1; j <= b.length; j++)
        d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[a.length][b.length];
  }

  function matchSpoken(spoken) {
    const s = norm(spoken);
    if (!s) return;
    let seen = 0;
    for (let i = pos; i < words.length && seen < LOOKAHEAD; i++) {
      if (!words[i].norm) continue;
      seen++;
      if (similar(words[i].norm, s)) { setPos(i + 1); return; }
    }
  }

  function startListening() {
    if (!SR) return;
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = navigator.language || "en-US";
    consumed = {};
    rec.onresult = e => {
      for (let r = e.resultIndex; r < e.results.length; r++) {
        const spoken = e.results[r][0].transcript.trim().split(/\s+/).filter(Boolean);
        const done = consumed[r] || 0;
        for (let k = done; k < spoken.length; k++) matchSpoken(spoken[k]);
        consumed[r] = Math.max(done, spoken.length);
      }
    };
    rec.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        setStatus("Microphone access was blocked. Allow the mic for this page, or tap words / press Space instead.");
        stopListening();
      }
    };
    // Browsers stop recognition periodically; restart while still listening.
    rec.onend = () => {
      if (listening) { consumed = {}; try { rec.start(); } catch {} }
    };
    try { rec.start(); } catch {}
    listening = true;
    $("micBtn").textContent = "■ Stop listening";
    $("micBtn").className = "live";
    setStatus("Listening… read aloud.");
  }

  function stopListening() {
    listening = false;
    if (rec) { rec.onend = null; try { rec.stop(); } catch {} rec = null; }
    $("micBtn").textContent = "🎤 Start listening";
    $("micBtn").className = "primary";
    if ($("reader").style.display === "flex" && pos < words.length) setStatus("Paused.");
  }

  $("micBtn").addEventListener("click", () => listening ? stopListening() : startListening());

  // ---------- Stopwatch ----------
  let swStart = 0, swElapsed = 0, swTimer = null;
  function fmt(ms) {
    const t = Math.floor(ms / 100);
    const tenths = t % 10, s = Math.floor(t / 10) % 60, m = Math.floor(t / 600) % 60, h = Math.floor(t / 36000);
    const mmss = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${tenths}`;
    return h ? `${h}:${mmss}` : mmss;
  }
  function tick() { $("time").textContent = fmt(swElapsed + (swTimer ? performance.now() - swStart : 0)); }
  $("swBtn").addEventListener("click", () => {
    if (swTimer) {
      swElapsed += performance.now() - swStart;
      clearInterval(swTimer); swTimer = null;
      $("swBtn").textContent = "Start"; $("swBtn").className = "primary";
    } else {
      swStart = performance.now();
      swTimer = setInterval(tick, 100);
      $("swBtn").textContent = "Pause"; $("swBtn").className = "";
    }
    tick();
  });
  $("swReset").addEventListener("click", () => {
    swElapsed = 0;
    if (swTimer) swStart = performance.now();
    tick();
  });
})();
</script>
</body>
</html>
